name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the scan reads the commit messages of a pull request
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: no private content
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          REQUIRE_PRIVATE_PATTERNS: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          SCAN_LOG_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/scan-private.mjs
      - run: npm test
      - run: npm pack --dry-run
      - name: package, plugin and skill pins name one version
        run: |
          v=$(node -p 'require("./package.json").version')
          test "$(node -p 'require("./.claude-plugin/plugin.json").version')" = "$v"
          ! grep -rhoE 'npx -y avouch@[0-9][^` ]*' skills | grep -vx "npx -y avouch@$v"
      - name: no old npm package name in skills, templates, cli and hooks
        run: "! grep -rn '@githonllc/avouch' skills templates cli hooks/*.mjs | grep -v 'old name'"
