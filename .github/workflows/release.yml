name: release
# Publishes to npm when a tag v<version> is pushed. Uses npm trusted publishing (OIDC): no token is stored,
# and npm adds provenance. The `npm` environment requires the owner's approval before the job runs.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.repository == 'githonllc/avouch'   # only the public repository publishes; a tag in the internal repository does nothing
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11   # trusted publishing needs npm 11.5.1 or later
      - name: tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: no private content
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          REQUIRE_PRIVATE_PATTERNS: 1   # a release never runs without the private patterns
        run: node scripts/scan-private.mjs
      - run: npm pkg delete private
      - run: npm pack --dry-run
      # The old unrelated avouch 1.0.x versions are higher than 0.x, so npm 11 refuses to move `latest` without an explicit --tag.
      - run: npm publish --access public --tag latest
